  abd.scale.set(1+blood/130,1+blood/80,1+blood/200);abdPale.color.setRGB(.79-.45*blood/100,.7-.62*blood/100,.48-.4*blood/100);abdDark.color.setRGB(.16+.3*blood/100,.125-.08*blood/100,.1-.07*blood/100);
  if(blood>=100)end(true,'🩸 吃飽了！你成功吸滿血液，剩餘時間 '+Math.ceil(tleft)+' 秒。');
  else if(tleft<=0)end(false,'⏰ 時間到，你仲未吸夠血……');
  // audio
  if(gn&&run){let m=9;humans.forEach(h=>m=Math.min(m,h.G.position.distanceTo(P)));gn.gain.value=.05*Math.max(.15,1-m/5);osc.frequency.value=430+V.length()*20+Math.sin(T*30)*8}
 }
 mq.position.copy(P);mq.rotation.set(pitch*.6,yaw,0);
 // camera

 const cp=P.clone().addScaledVector(cf,-.5).add(new THREE.Vector3(0,.14,0));
 cp.x=Math.max(-5.9,Math.min(5.9,cp.x));cp.y=Math.max(.05,Math.min(3.15,cp.y));cp.z=Math.max(-3.9,Math.min(3.9,cp.z));
 cam.position.lerp(cp,1-Math.exp(-12*dt));cam.lookAt(P.clone().addScaledVector(cf,.5));
 R.render(S,cam)}
